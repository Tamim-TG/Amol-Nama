app = "আমলনামা"

primary_region = "sin"

[build]

[env]
  PYTHONUNBUFFERED = "1"

[deploy]
  strategy = "immediate"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[processes]
  app = "python bot.py"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]